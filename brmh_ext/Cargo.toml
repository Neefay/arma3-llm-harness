[package]
name = "brmh_ext"
version = "0.2.0"
edition = "2024"
description = "BRMH harness extension for Arma 3: bridge, callbacks, in-engine capture"

[lib]
name = "brmh"
crate-type = ["cdylib", "rlib"]

[dependencies]
arma-rs = { version = "1.13", features = ["serde_json"] }
serde_json = "1"
png = "0.17"
log = "0.4"

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
debug = 1
