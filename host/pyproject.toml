[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "arma-harness"
version = "0.2.0"
description = "Drive and observe Arma 3 from tools and LLM agents (MCP): headless servers, SQF exec, events, snapshots, scenarios."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "pillow>=10.1",
    "psutil>=6",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
arma-harness = "arma_harness.cli:main"
arma-harness-mcp = "arma_harness.mcp_server:main"
arma-commander-mcp = "arma_harness.commander.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arma_harness"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tests/spikes"]  # throwaway engine tests, kept as a record of how design facts were measured

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
