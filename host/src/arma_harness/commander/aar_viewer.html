<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Battle Review</title>
<style>
/* Layout concept: an after-action review table. Two maps side by side, one for belief and one for truth, over a shared
   timeline, with the radio log running alongside. Deliberately single-theme: a dark ops room, and only blue and red shout. */
:root {
  color-scheme: dark;
  --bg: #11161b; --panel: #1a2128; --panel2: #232c35; --line: #36424e;
  --text: #e6ebef; --dim: #9aa8b4; --blue: #5aa9f5; --red: #f2685c; --green: #5cc58a; --amber: #e8b04a; --violet: #b28cf0;
  --land: #171d23; --grid: #27313a; --building: #4b5763; --checked: #3f8a63;
  --display: "Bahnschrift", "DIN Alternate", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--body); }
.page { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding-block: 14px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1680px; margin-inline: auto; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 18px; }
h1 { font: 700 26px/1.1 var(--display); margin: 0; letter-spacing: .01em; }
.meta { color: var(--dim); font-size: 13px; }
.result { font: 600 15px var(--display); padding: 2px 10px; border: 1px solid var(--line); }
.result.win { color: var(--green); border-color: var(--green); }
.result.loss { color: var(--red); border-color: var(--red); }
.result.llm, .result.scripted { font: 500 13px var(--body); }
.result.llm { color: var(--violet); border-color: var(--violet); }
.result.scripted { color: var(--amber); border-color: var(--amber); }
.mission { color: var(--dim); max-width: 90ch; margin: 0; }
.score { display: flex; flex-wrap: wrap; gap: 6px 26px; margin: 0; background: var(--panel); padding: 10px 12px; }
.score div { display: grid; gap: 1px; }
.score dt { color: var(--dim); font-size: 12px; }
.score dd { margin: 0; font: 600 18px var(--display); font-variant-numeric: tabular-nums; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--panel); padding: 8px 12px; }
button { font: 600 13px var(--body); color: var(--text); background: var(--panel2); border: 1px solid var(--line); padding: 5px 12px; cursor: pointer; }
button:hover { border-color: var(--dim); }
button:focus-visible, input:focus-visible, .row:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
button[aria-pressed="true"] { background: var(--blue); color: #08131e; border-color: var(--blue); }
#clock { font: 700 22px var(--mono); font-variant-numeric: tabular-nums; min-width: 6.5ch; }
.timeline { background: var(--panel); padding: 8px 12px 10px; display: grid; gap: 4px; }
.timeline canvas { width: 100%; height: 86px; display: block; cursor: pointer; touch-action: none; }
.legend { display: flex; flex-wrap: wrap; gap: 3px 14px; color: var(--dim); font-size: 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; }
.maps { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 12px; }
figure { margin: 0; background: var(--panel); min-width: 0; }
figcaption { font: 600 15px var(--display); padding: 7px 12px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
figcaption small { font: 400 12px var(--body); color: var(--dim); }
.truth figcaption { color: var(--red); }
.belief figcaption { color: var(--blue); }
figure canvas { display: block; width: 100%; aspect-ratio: 1; cursor: grab; touch-action: pan-y; }
figure canvas:active { cursor: grabbing; }
.lower { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 12px; align-items: start; }
.panel { background: var(--panel); min-width: 0; }
h2 { font: 600 15px var(--display); margin: 0; padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; color: var(--dim); font-weight: 500; padding: 6px 10px; border-bottom: 1px solid var(--line); }
td { padding: 6px 10px; border-bottom: 1px solid var(--panel2); vertical-align: top; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.gap { color: var(--amber); }
.dead { color: var(--red); font-weight: 600; }
.ok { color: var(--green); }
.list { max-height: 460px; overflow-y: auto; }
.list.short { max-height: 240px; }
.row { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 8px; padding: 4px 12px; border-bottom: 1px solid var(--panel2); cursor: pointer; background: none; border-left: 3px solid transparent; width: 100%; text-align: left; color: inherit; font: inherit; }
.row:hover { background: var(--panel2); }
.row .t { font: 12px var(--mono); color: var(--dim); }
.row.future { opacity: .35; }
.row.now { background: var(--panel2); border-left-color: var(--amber); }
.row.flash .text { color: var(--red); font-weight: 600; }
.row.hq .text { color: var(--blue); }
.row.quiet .text { color: var(--dim); }
.row.silent .text { color: var(--amber); font-style: italic; }
.who { font-weight: 600; }
.note { color: var(--dim); font-size: 13px; padding: 8px 12px; margin: 0; }
.notes { white-space: pre-wrap; max-height: 260px; overflow-y: auto; font: 12.5px/1.5 var(--mono); }
.said { padding: 8px 12px 0; margin: 0; white-space: pre-wrap; max-height: 220px; overflow-y: auto; }
.did { color: var(--amber); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { font-size: 12px; padding: 2px 8px; font-weight: 500; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1 id="name">Battle Review</h1>
    <span class="result" id="result"></span>
    <span class="result" id="who"></span>
    <span class="meta" id="meta"></span>
    <p class="mission" id="mission" style="flex-basis: 100%"></p>
  </header>

  <dl class="score" id="score"></dl>

  <div class="controls">
    <button id="play" type="button">Play</button>
    <span id="clock">T+00:00</span>
    <span class="chips" role="group" aria-label="Playback speed">
      <button type="button" data-speed="1">1×</button>
      <button type="button" data-speed="5" aria-pressed="true">5×</button>
      <button type="button" data-speed="20">20×</button>
    </span>
    <button id="prevEvent" type="button" title="Previous kill">◀ Kill</button>
    <button id="nextEvent" type="button" title="Next kill">Kill ▶</button>
    <span class="chips" role="group" aria-label="Map zoom">
      <button type="button" id="zoomIn" title="Zoom in. The mouse wheel works too, and dragging moves the map.">Zoom in</button>
      <button type="button" id="zoomOut">Zoom out</button>
      <button type="button" id="zoomAll">Whole battle</button>
    </span>
    <span class="meta" id="tick"></span>
  </div>

  <div class="timeline">
    <canvas id="timeline" role="slider" tabindex="0" aria-label="Battle timeline"></canvas>
    <div class="legend">
      <span><i style="background:var(--blue)"></i>Friendly soldiers alive: <b id="westNow"></b></span>
      <span><i style="background:var(--red)"></i>Enemy soldiers alive: <b id="eastNow"></b></span>
      <span><i style="background:var(--violet)"></i>Commander taking a turn</span>
      <span><i style="background:var(--amber)"></i>Order sent</span>
      <span>Map squares are 100 m</span>
    </div>
  </div>

  <div class="maps">
    <figure class="belief">
      <figcaption>What the commander believed <small>its markers and last reports, ageing</small></figcaption>
      <canvas id="beliefMap"></canvas>
    </figure>
    <figure class="truth">
      <figcaption>What was really happening <small>true positions, never shown to the commander</small></figcaption>
      <canvas id="truthMap"></canvas>
    </figure>
  </div>

  <div class="lower">
    <section class="panel">
      <h2>Belief against reality <small class="meta" id="gapNote"></small></h2>
      <div class="scroll"><table id="stations"></table></div>
      <p class="note" id="enemyGap"></p>
      <h2>In the commander's head</h2>
      <p class="said" id="turnSaid" hidden></p>
      <p class="note notes" id="turnNote"></p>
    </section>
    <section class="panel">
      <h2>Radio log
        <span class="chips" role="group" aria-label="Filter">
          <button type="button" id="followRadio" aria-pressed="true">Follow</button>
          <button type="button" id="showAll">Hide routine</button>
        </span>
      </h2>
      <div class="list" id="radio"></div>
    </section>
    <section class="panel">
      <h2>Deaths <small class="meta">never shown to the commander</small></h2>
      <div class="list short" id="deaths"></div>
    </section>
    <section class="panel">
      <h2>Commander's turns <small class="meta" id="turnStats"></small></h2>
      <div class="list" id="turns"></div>
    </section>
  </div>
</div>

<script id="battle" type="application/json">/*BATTLE_DATA*/</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("battle").textContent);
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const C = { blue: css("--blue"), red: css("--red"), green: css("--green"), amber: css("--amber"), violet: css("--violet"), text: css("--text"), dim: css("--dim"), land: css("--land"), grid: css("--grid"), building: css("--building"), checked: css("--checked"), line: css("--line") };
const MARKER = { enemy: C.red, danger: "#e8843a", hypothesis: C.violet, objective: C.green, friendly: C.blue, note: C.dim, phase_line: C.amber, area: C.amber };
const $ = id => document.getElementById(id);
const fmt = t => { t = Math.max(0, Math.round(t)); return `T+${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`; };
const ago = s => { s = Math.max(0, Math.round(s)); return s < 90 ? `${s} s` : `${Math.round(s / 60)} min`; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const isEnemy = name => D.enemies.includes(name);

const duration = Math.max(1, D.duration);
let now = 0, playing = false, speed = 5, follow = true, hideRoutine = false, last = 0;

// One view for both maps, fitted to everything that happened, so the two can be compared by eye.
const view = (() => {
  let xs = [], ys = [];
  for (const b of D.buildings) { xs.push(b.pos[0]); ys.push(b.pos[1]); }
  for (const f of D.frames) for (const g of f.groups) for (const u of g.units) if (u[0] > 1 || u[1] > 1) { xs.push(u[0]); ys.push(u[1]); }
  for (const m of D.markers) for (const q of m.points || (m.pos ? [m.pos] : [])) { xs.push(q[0]); ys.push(q[1]); }
  for (const r of D.radio) if (r.pos) { xs.push(r.pos[0]); ys.push(r.pos[1]); }
  if (!xs.length) return { cx: (D.world_size || 8192) / 2, cy: (D.world_size || 8192) / 2, half: 500 };
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  return { cx: (minX + maxX) / 2, cy: (minY + maxY) / 2, half: Math.max(maxX - minX, maxY - minY) / 2 + 70 };
})();

const whole = { ...view };

function fit(canvas) {
  const ratio = window.devicePixelRatio || 1, box = canvas.getBoundingClientRect();
  const w = Math.round(box.width * ratio), h = Math.round(box.height * ratio);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  return { ctx, w: box.width, h: box.height };
}

function projector(w) {
  const scale = w / (2 * view.half);
  return { scale, xy: (x, y) => [(x - view.cx + view.half) * scale, w - (y - view.cy + view.half) * scale] };
}

function ground(ctx, w, p) {
  ctx.fillStyle = C.land; ctx.fillRect(0, 0, w, w);
  const step = view.half > 900 ? 500 : 100;
  ctx.strokeStyle = C.grid; ctx.lineWidth = 1; ctx.fillStyle = C.dim; ctx.font = "10px Consolas, monospace";
  const low = view.cx - view.half, high = view.cx + view.half, lowY = view.cy - view.half, highY = view.cy + view.half;
  for (let x = Math.ceil(low / step) * step; x <= high; x += step) {
    const [px] = p.xy(x, lowY); ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, w); ctx.stroke();
    ctx.fillText(String(x / 100).padStart(3, "0"), px + 2, w - 3);
  }
  for (let y = Math.ceil(lowY / step) * step; y <= highY; y += step) {
    const [, py] = p.xy(low, y); ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(w, py); ctx.stroke();
    ctx.fillText(String(y / 100).padStart(3, "0"), 2, py - 2);
  }
}

function buildings(ctx, p, checkedBy) {
  for (const b of D.buildings) {
    const hw = (b.width || 8) / 2, hl = (b.length || 8) / 2, a = (b.dir || 0) * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
    const corners = [[-hw, -hl], [hw, -hl], [hw, hl], [-hw, hl]].map(([dx, dy]) => p.xy(b.pos[0] + dx * c + dy * s, b.pos[1] - dx * s + dy * c));
    ctx.beginPath(); corners.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath();
    ctx.fillStyle = checkedBy && checkedBy(b.id) ? C.checked : C.building; ctx.fill();
    ctx.strokeStyle = "#0008"; ctx.stroke();
    const [x, y] = p.xy(b.pos[0], b.pos[1]);
    ctx.fillStyle = C.text; ctx.font = "600 10px Segoe UI, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(b.id, x, y); ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  }
}

function frameAt(t) {
  const fs = D.frames;
  if (!fs.length) return null;
  let lo = 0, hi = fs.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (fs[mid].t <= t) lo = mid; else hi = mid - 1; }
  return { a: fs[lo], b: fs[Math.min(lo + 1, fs.length - 1)] };
}

let placed = [];

function label(ctx, text, x, y, colour) {
  ctx.font = "600 12px Segoe UI, sans-serif";
  const width = ctx.measureText(text).width;
  for (let tries = 0; tries < 8 && placed.some(b => x < b.x + b.width && x + width > b.x && Math.abs(y - b.y) < 13); tries++) y += 14;
  placed.push({ x, y, width });
  ctx.lineWidth = 3; ctx.strokeStyle = C.land; ctx.strokeText(text, x, y);
  ctx.fillStyle = colour; ctx.fillText(text, x, y);
}

function drawTruth() {
  const { ctx, w } = fit($("truthMap")), p = projector(w);
  placed = [];
  ground(ctx, w, p); buildings(ctx, p);
  for (const k of D.kills) {
    if (k.t > now || !k.victimPos) continue;
    const [x, y] = p.xy(k.victimPos[0], k.victimPos[1]), fresh = now - k.t < 12;
    ctx.strokeStyle = k.friendly ? C.blue : C.red; ctx.lineWidth = fresh ? 2.5 : 1.2; ctx.globalAlpha = fresh ? 1 : .45;
    const r = fresh ? 7 : 4;
    ctx.beginPath(); ctx.moveTo(x - r, y - r); ctx.lineTo(x + r, y + r); ctx.moveTo(x + r, y - r); ctx.lineTo(x - r, y + r); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  const f = frameAt(now);
  if (!f) return;
  const blend = f.b.t > f.a.t ? Math.min(1, (now - f.a.t) / (f.b.t - f.a.t)) : 0;
  for (const g of f.a.groups) {
    if (!g.alive) continue;
    const next = f.b.groups.find(n => n.group === g.group), colour = isEnemy(g.group) ? C.red : C.blue;
    const units = g.units.length ? g.units : (g.pos.length ? [g.pos] : []);
    let sx = 0, sy = 0;
    units.forEach((u, i) => {
      const v = next && next.units.length === units.length ? next.units[i] : u;
      const [x, y] = p.xy(u[0] + (v[0] - u[0]) * blend, u[1] + (v[1] - u[1]) * blend);
      ctx.beginPath(); ctx.arc(x, y, 3.2, 0, 7); ctx.fillStyle = colour; ctx.fill();
      sx += x; sy += y;
    });
    if (units.length) label(ctx, `${g.group} ${g.alive}`, sx / units.length + 8, sy / units.length - 7, colour);
  }
}

function markersAt(t) {
  const out = new Map();
  for (const m of D.markers) { if (m.t > t) break; if (m.retired) out.delete(m.id); else out.set(m.id, m); }
  return out;
}

function drawBelief() {
  const { ctx, w } = fit($("beliefMap")), p = projector(w);
  placed = [];
  ground(ctx, w, p);
  const checked = new Map(); for (const r of D.radio) { if (r.t > now) break; if (r.checked) checked.set(r.checked, r.t); }
  buildings(ctx, p, id => checked.has(id));
  for (const m of markersAt(now).values()) {
    const colour = MARKER[m.kind] || C.text, age = m.t == null ? 0 : now - m.t;
    ctx.globalAlpha = Math.max(.35, 1 - age / 600);
    const text = [m.id, m.label, m.confidence].filter(Boolean).join(" ");
    if (m.points) {
      const pts = m.points.map(q => p.xy(q[0], q[1]));
      ctx.strokeStyle = colour; ctx.lineWidth = 2; ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
      if (m.kind === "area") ctx.closePath();
      ctx.stroke(); label(ctx, text, pts[0][0] + 4, pts[0][1] - 4, colour);
    } else {
      if (!m.pos) { ctx.globalAlpha = 1; continue; }
      const [x, y] = p.xy(m.pos[0], m.pos[1]);
      ctx.strokeStyle = colour; ctx.lineWidth = 2.2; ctx.beginPath();
      if (m.kind === "enemy" || m.kind === "danger") { ctx.moveTo(x, y - 8); ctx.lineTo(x + 8, y); ctx.lineTo(x, y + 8); ctx.lineTo(x - 8, y); ctx.closePath(); }
      else if (m.kind === "objective") ctx.arc(x, y, 10, 0, 7);
      else ctx.arc(x, y, 5, 0, 7);
      ctx.stroke(); label(ctx, text, x + 11, y + 4, colour);
    }
    ctx.globalAlpha = 1;
  }
  const seen = {};
  for (const r of D.radio) { if (r.t > now) break; if (r.pos) seen[r.from] = r; }
  // The order each station was last given, as a dashed line from where it was last reported.
  const ordered = {};
  for (const o of D.orders) { if (o.t > now) break; if (o.to) ordered[o.to] = o; }
  for (const [station, r] of Object.entries(seen)) {
    const [x, y] = p.xy(r.pos[0], r.pos[1]), o = ordered[station], age = now - r.t;
    if (o && o.target) {
      const [tx, ty] = p.xy(o.target[0], o.target[1]);
      ctx.setLineDash([5, 5]); ctx.strokeStyle = C.amber; ctx.lineWidth = 1; ctx.globalAlpha = .6;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(tx, ty); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    ctx.globalAlpha = Math.max(.4, 1 - age / 400);
    ctx.strokeStyle = C.blue; ctx.lineWidth = 2; ctx.strokeRect(x - 11, y - 7, 22, 14);
    ctx.beginPath(); ctx.moveTo(x - 11, y - 7); ctx.lineTo(x + 11, y + 7); ctx.moveTo(x - 11, y + 7); ctx.lineTo(x + 11, y - 7); ctx.stroke();
    label(ctx, `${station} · ${ago(age)} ago`, x + 14, y + 4, C.blue);
    ctx.globalAlpha = 1;
  }
}

function alivePoints() {
  return D.frames.map(f => {
    let west = 0, east = 0;
    for (const g of f.groups) { if (isEnemy(g.group)) east += g.alive; else west += g.alive; }
    return { t: f.t, west, east };
  });
}
const alive = alivePoints();
const peak = Math.max(1, ...alive.map(a => Math.max(a.west, a.east)));

function drawTimeline() {
  const { ctx, w, h } = fit($("timeline")), x = t => t / duration * w, top = 14, bottom = h - 16;
  ctx.clearRect(0, 0, w, h);
  const every = [30, 60, 120, 300, 600, 1200].find(step => duration / step <= Math.max(2, w / 70)) || 1800;
  ctx.font = "10px Consolas, monospace"; ctx.fillStyle = C.dim;
  for (let t = every; t < duration; t += every) {
    ctx.fillRect(x(t), bottom, 1, 4);
    ctx.fillText(`${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`, x(t) + 3, h - 2);
  }
  for (const turn of D.turns) {
    ctx.fillStyle = C.violet; ctx.globalAlpha = .35;
    ctx.fillRect(x(turn.start), 0, Math.max(2, x(turn.end ?? turn.start) - x(turn.start)), bottom);
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = C.amber; for (const o of D.orders) ctx.fillRect(x(o.t) - .5, 0, 1.5, 9);
  const line = (key, colour) => {
    ctx.strokeStyle = colour; ctx.lineWidth = 2; ctx.beginPath();
    alive.forEach((a, i) => { const px = x(a.t), py = bottom - (a[key] / peak) * (bottom - top); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
    ctx.stroke();
  };
  line("west", C.blue); line("east", C.red);
  ctx.fillStyle = C.red; for (const k of D.kills) ctx.fillRect(x(k.t) - 1, bottom - 5, 2, 5);
  ctx.strokeStyle = C.text; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x(now), 0); ctx.lineTo(x(now), h); ctx.stroke();
}

function describe(action) {
  const i = action.input || {};
  switch (action.tool) {
    case "order": return `Order ${i.to}: ${(i.legs || []).map(l => `${l.type} ${[].concat(l.at ?? "").join(", ")}`.trim()).join(", then ")}`;
    case "ask": return `Asked ${[].concat(i.to || "everyone").join(", ")}: ${(i.topics || ["SITREP"]).join(", ")}`;
    case "schedule": return `Timer ${i.at || `in ${i.after || i.every}`}: ${i.do && i.do.wake ? i.do.wake : "a question"}`;
    case "unschedule": return `Cancelled timer ${i.id}`;
    case "mark": return `Marked ${i.id || "a new point"}${i.at ? ` at ${[].concat(i.at).join(", ")}` : ""}${i.label ? `: ${i.label}` : ""}`;
    case "unmark": return `Removed marker ${i.id}`;
    default: return action.tool;
  }
}

function renderRows() {
  $("radio").innerHTML = D.radio.map((r, i) => {
    const quiet = r.kind === "checkin_unchanged" || r.kind === "question";
    const cls = ["row", r.from === "HQ" ? "hq" : "", r.precedence === "flash" ? "flash" : "", quiet ? "quiet" : "", r.kind === "no_answer" ? "silent" : ""].join(" ");
    return `<button type="button" class="${cls}" data-t="${r.t}" data-quiet="${quiet}" data-i="${i}"><span class="t">${fmt(r.t).slice(2)}</span><span class="text"><span class="who">${esc(r.from)}</span>: ${esc(r.text)}</span></button>`;
  }).join("");
  $("turns").innerHTML = D.turns.map(t => {
    const did = (t.actions || []).filter(a => a.tool !== "notes").map(describe);
    return `<button type="button" class="row" data-t="${t.start}"><span class="t">${fmt(t.start).slice(2)}</span><span class="text"><span class="who">Turn ${t.turn}</span> <span class="meta">woke on ${esc(t.woke_on)}${t.duration != null ? `, ${t.duration} s` : ""}</span>${did.map(d => `<br><span class="did">${esc(d)}</span>`).join("")}${t.note ? `<br><span class="meta">${esc(t.note)}</span>` : ""}</span></button>`;
  }).join("");
  $("deaths").innerHTML = D.kills.length ? D.kills.map(k => {
    const by = k.killer && k.killer !== k.victim ? `killed by ${esc(k.killer)}${k.distance != null ? ` at ${Math.round(k.distance)} m` : ""}` : "died";
    return `<button type="button" class="row" data-t="${k.t}"><span class="t">${fmt(k.t).slice(2)}</span><span class="text" style="color:${k.friendly ? "var(--blue)" : "var(--red)"}"><span class="who">${esc(k.victim || "Someone")}</span> <span class="meta">${by}</span></span></button>`;
  }).join("") : `<p class="note">Nobody died.</p>`;
  for (const box of [$("radio"), $("turns"), $("deaths")]) box.addEventListener("click", e => { const row = e.target.closest(".row"); if (row) seek(+row.dataset.t); });
}

function updateRows() {
  let current = null;
  for (const row of $("radio").children) {
    const t = +row.dataset.t, future = t > now;
    row.classList.toggle("future", future); row.classList.remove("now");
    row.hidden = hideRoutine && row.dataset.quiet === "true";
    if (!future && !row.hidden) current = row;
  }
  if (current) { current.classList.add("now"); if (follow) { const box = $("radio"); box.scrollTop = current.offsetTop - box.offsetTop - box.clientHeight / 2; } }
  let currentTurn = null;
  for (const row of $("deaths").children) if (row.dataset.t) row.classList.toggle("future", +row.dataset.t > now);
  for (const row of $("turns").children) { const future = +row.dataset.t > now; row.classList.toggle("future", future); row.classList.remove("now"); if (!future) currentTurn = row; }
  if (currentTurn) { currentTurn.classList.add("now"); if (follow) { const box = $("turns"); box.scrollTop = currentTurn.offsetTop - box.offsetTop - box.clientHeight / 2; } }
}

function updateStations() {
  const f = frameAt(now), rows = [];
  let gaps = 0;
  for (const [station, info] of Object.entries(D.stations)) {
    const reports = D.radio.filter(r => r.from === station && r.t <= now && r.kind !== "no_answer");
    const heard = reports.length ? reports[reports.length - 1] : null;
    const group = f ? f.a.groups.find(g => g.group === station) : null;
    const trueAlive = group ? group.alive : info.units;
    const lastText = heard ? heard.text : "Nothing heard yet";
    let located = null; for (const r of reports) if (r.pos) located = r;
    const dead = trueAlive === 0, killedAt = dead ? D.kills.filter(k => k.t <= now && k.side === "WEST").map(k => k.t).pop() : null;
    let trueWords;
    if (dead) { trueWords = `<span class="dead">Wiped out</span>${killedAt != null ? ` ${ago(now - killedAt)} ago` : ""}`; gaps += 1; }
    else {
      const off = located && group && group.pos.length ? Math.round(Math.hypot(located.pos[0] - group.pos[0], located.pos[1] - group.pos[1])) : null;
      trueWords = `<span class="${trueAlive < info.units ? "gap" : "ok"}">${trueAlive} of ${info.units}</span>${off != null ? `<br><span class="${off > 150 ? "gap" : "meta"}">${off} m from last reported</span>` : ""}`;
    }
    rows.push(`<tr><td class="who">${esc(station)}</td><td>${esc(lastText)}<br><span class="meta">${heard ? `${ago(now - heard.t)} ago` : ""}</span></td><td class="num">${trueWords}</td></tr>`);
  }
  $("stations").innerHTML = `<thead><tr><th>Station</th><th>Last heard by the commander</th><th>Really</th></tr></thead><tbody>${rows.join("")}</tbody>`;
  const counts = alive.length ? alive[Math.max(0, alive.findLastIndex(a => a.t <= now))] : { west: 0, east: 0 };
  $("westNow").textContent = counts.west; $("eastNow").textContent = counts.east;
  $("gapNote").textContent = gaps ? `${gaps} station${gaps > 1 ? "s" : ""} gone` : "";
  const enemies = f ? f.a.groups.filter(g => D.enemies.includes(g.group)) : [];
  const enemyAlive = enemies.reduce((sum, g) => sum + g.alive, 0);
  const marked = [...markersAt(now).values()].filter(m => m.kind === "enemy").length;
  $("enemyGap").innerHTML = D.enemies.length ? `Enemy really alive: <b class="${enemyAlive ? "gap" : "ok"}">${enemyAlive} of ${D.enemy_total}</b>. Enemy markers on the commander's map: <b>${marked}</b>.` : "No enemy in this battle.";
  let turn = null, notes = "";
  for (const t of D.turns) {
    if (t.start > now) break;
    turn = t;
    for (const a of t.actions || []) if (a.tool === "notes") notes = a.input.text || notes;
  }
  const said = turn && turn.said && turn.said.length ? turn.said[turn.said.length - 1] : "";
  $("turnSaid").textContent = said;
  $("turnSaid").hidden = !said;
  $("turnNote").textContent = notes || (now >= duration && D.notes) || (D.commander.model ? "No notes written yet." : "Scripted test, so nobody was thinking.");
  const n = D.radio.filter(r => r.t <= now).length, k = D.kills.filter(x => x.t <= now).length;
  $("tick").textContent = `${n} radio messages, ${k} deaths so far`;
}

function draw() {
  $("clock").textContent = fmt(now);
  drawTruth(); drawBelief(); drawTimeline(); updateStations(); updateRows();
  const box = $("timeline"); box.setAttribute("aria-valuenow", Math.round(now)); box.setAttribute("aria-valuetext", fmt(now));
}

function seek(t) {
  now = Math.max(0, Math.min(duration, t));
  draw();
  try { history.replaceState(null, "", `#t${Math.round(now)}`); } catch (_) { /* some viewers refuse */ }
}

function loop(stamp) {
  if (!playing) return;
  now += (stamp - last) / 1000 * speed; last = stamp;
  if (now >= duration) { now = duration; playing = false; $("play").textContent = "Replay"; }
  draw();
  if (playing) requestAnimationFrame(loop);
}

function togglePlay() {
  if (!playing && now >= duration) now = 0;
  playing = !playing;
  $("play").textContent = playing ? "Pause" : "Play";
  if (playing) { last = performance.now(); requestAnimationFrame(loop); }
}

function zoom(factor, fx = .5, fy = .5) {
  const worldX = view.cx - view.half + fx * 2 * view.half, worldY = view.cy + view.half - fy * 2 * view.half;
  const half = Math.max(40, Math.min(whole.half, view.half * factor));
  view.half = half;
  view.cx = half === whole.half ? whole.cx : worldX - (fx * 2 - 1) * half;
  view.cy = half === whole.half ? whole.cy : worldY + (fy * 2 - 1) * half;
  draw();
}

function mapControls(canvas) {
  let drag = null;
  canvas.addEventListener("wheel", e => {
    if (e.deltaY > 0 && view.half >= whole.half) return; // fully out: let the page scroll on
    e.preventDefault();
    const box = canvas.getBoundingClientRect();
    zoom(e.deltaY > 0 ? 1.25 : .8, (e.clientX - box.left) / box.width, (e.clientY - box.top) / box.height);
  }, { passive: false });
  canvas.addEventListener("pointerdown", e => {
    if (e.pointerType !== "mouse") return; // a finger on the map scrolls the page; the zoom buttons work everywhere
    drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", e => {
    if (!drag) return;
    const metres = 2 * view.half / canvas.getBoundingClientRect().width;
    view.cx -= (e.clientX - drag.x) * metres; view.cy += (e.clientY - drag.y) * metres;
    drag = { x: e.clientX, y: e.clientY }; draw();
  });
  canvas.addEventListener("pointerup", () => { drag = null; });
}

function scrubAt(event) {
  const box = $("timeline").getBoundingClientRect();
  seek((event.clientX - box.left) / box.width * duration);
}

function init() {
  document.title = D.name ? `Battle Review: ${D.name}` : "Battle Review";
  $("name").textContent = D.name || "Battle Review";
  $("mission").textContent = D.text || "";
  const result = $("result");
  result.textContent = D.ended || "Didn't finish";
  result.className = "result " + (/achieved/i.test(D.ended || "") ? "win" : /lost|time limit/i.test(D.ended || "") ? "loss" : "");
  const c = D.commander;
  $("who").textContent = c.model ? `Commanded by ${c.model}: ${c.requests} requests, ${Math.round(c.output_tokens / 100) / 10}k tokens written` : "Scripted test: no model session found";
  $("who").className = "result " + (c.model ? "llm" : "scripted");
  $("meta").textContent = `${fmt(duration)}, ${D.turns.length} turns, ${D.mode || ""} mode, run ${D.run || ""}${D.attempt > 1 ? ` attempt ${D.attempt}` : ""}`;
  $("turnStats").textContent = D.turns.length ? `average ${(D.turns.reduce((s, t) => s + (t.duration || 0), 0) / D.turns.length).toFixed(1)} s` : "";
  $("timeline").setAttribute("aria-valuemin", 0); $("timeline").setAttribute("aria-valuemax", Math.round(duration));
  const s = D.score, clock = t => t == null ? "None" : fmt(t).slice(2);
  const metres = m => m == null ? "None" : `${m} m`;
  const facts = [
    ["Friendly lost", `${s.friendly_lost} of ${s.friendly_total}`], ["Enemy killed", `${s.enemy_killed} of ${s.enemy_total}`],
    ["First contact", clock(s.first_contact_s)], ["Turns", s.turns], ["Orders", s.orders], ["Questions", s.questions],
    ["Enemy markers", s.enemy_markers], ["Marker error", metres(s.marker_error_m), "Average distance from each enemy marker, when placed, to the nearest enemy really alive"],
    ["Position error", metres(s.position_error_m), "Average distance from each living station to the last position it reported"],
  ];
  $("score").innerHTML = facts.map(([name, value, why]) => `<div${why ? ` title="${esc(why)}"` : ""}><dt>${esc(name)}</dt><dd>${esc(value)}</dd></div>`).join("");
  renderRows();
  mapControls($("beliefMap")); mapControls($("truthMap"));
  $("zoomIn").addEventListener("click", () => zoom(.6));
  $("zoomOut").addEventListener("click", () => zoom(1 / .6));
  $("zoomAll").addEventListener("click", () => { Object.assign(view, whole); draw(); });
  $("play").addEventListener("click", togglePlay);
  for (const b of document.querySelectorAll("[data-speed]")) b.addEventListener("click", () => {
    speed = +b.dataset.speed;
    document.querySelectorAll("[data-speed]").forEach(o => o.setAttribute("aria-pressed", String(o === b)));
  });
  $("followRadio").addEventListener("click", e => { follow = !follow; e.target.setAttribute("aria-pressed", String(follow)); });
  $("showAll").addEventListener("click", e => { hideRoutine = !hideRoutine; e.target.setAttribute("aria-pressed", String(hideRoutine)); draw(); });
  const timeline = $("timeline");
  let dragging = false;
  timeline.addEventListener("pointerdown", e => { dragging = true; timeline.setPointerCapture(e.pointerId); scrubAt(e); });
  timeline.addEventListener("pointermove", e => { if (dragging) scrubAt(e); });
  timeline.addEventListener("pointerup", () => { dragging = false; });
  timeline.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") seek(now - 5); else if (e.key === "ArrowRight") seek(now + 5); else return;
    e.preventDefault();
  });
  const killTimes = D.kills.map(k => k.t);
  $("nextEvent").addEventListener("click", () => { const t = killTimes.find(k => k > now + .5); if (t != null) seek(t); });
  $("prevEvent").addEventListener("click", () => { const before = killTimes.filter(k => k < now - .5); if (before.length) seek(before[before.length - 1]); });
  document.addEventListener("keydown", e => { if (e.code === "Space" && !["BUTTON", "INPUT"].includes(document.activeElement.tagName)) { e.preventDefault(); togglePlay(); } });
  window.addEventListener("resize", draw);
  const hash = /^#t(\d+)$/.exec(location.hash);
  now = hash ? Math.min(duration, +hash[1]) : duration;
  $("play").textContent = hash ? "Play" : "Replay";
  draw();
}
init();
</script>
</body>
</html>
