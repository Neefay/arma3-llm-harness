name: ci

on:
  push:
  pull_request:

jobs:
  extension:
    name: Rust extension (fmt, clippy, tests)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: brmh_ext
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: brmh_ext
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release

  host:
    name: Host package (ruff, pytest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e "host[dev]"
      - run: python -m ruff check src tests
        working-directory: host
      - run: python -m pytest -q
        working-directory: host

  bridge:
    name: In-game bridge (Python 3.10, as embedded by Pythia)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -I python/tests/test_bridge.py

  addon:
    name: Addon (hemtt check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install HEMTT
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BrettMayson/HEMTT/releases/download/v1.23.1/windows-x64.zip -OutFile hemtt.zip
          Expand-Archive hemtt.zip -DestinationPath "$env:RUNNER_TEMP\hemtt"
          "$env:RUNNER_TEMP\hemtt" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - run: hemtt check
